<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Bank</title>
    <style>
        :root { --primary: #4CAF50; --gold: #FFD700; --dark: #2c3e50; --light: #f4f7f6; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--light); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; color: var(--dark); }
        .card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; margin-bottom: 20px; }
        h2 { text-align: center; color: var(--primary); margin-top: 0; }
        .leaderboard { display: flex; justify-content: space-around; background: var(--dark); color: white; padding: 15px; border-radius: 15px; width: 100%; max-width: 400px; margin-bottom: 20px; font-weight: bold; text-align: center; }
        .member-score { font-size: 0.8rem; }
        .member-score span { display: block; font-size: 1.2rem; color: var(--gold); }
        select, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid #ddd; font-size: 1rem; }
        button { background: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer; transition: transform 0.2s; }
        button:active { transform: scale(0.95); }
        .habit-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
        .habit-item label { flex-grow: 1; cursor: pointer; }
        .toggle { position: relative; width: 50px; height: 25px; }
        .toggle input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 17px; width: 17px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(25px); }
        #coin-animation { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; display: none; }
        .coin { position: absolute; font-size: 2rem; animation: fall 2s linear forwards; }
        @keyframes fall { to { transform: translateY(100vh) rotate(360deg); } }
    </style>
</head>
<body>

    <div class="leaderboard" id="leaderboard">Loading Bank...</div>

    <div class="card">
        <h2>💰 Daily Deposit</h2>
        <select id="memberSelect">
            <option value="Mama">Mama</option>
            <option value="Papa">Papa</option>
            <option value="Futku">Futku</option>
            <option value="Chutku">Chutku</option>
        </select>

        <div id="habitList"></div>
        <button onclick="submitData()">Claim My Coins!</button>
    </div>

    <div id="coin-animation"></div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzH3dlOhyQaC500nzq-tDSffdki0ZDoxEzw29vcB341_4baIXCpceuWSnqFw5NGU9P4/exec';
        const HABITS = [
            { name: "Brush teeth twice", price: 10 },
            { name: "Shower/Bath", price: 10 },
            { name: "Wake 6:30 / Bed 8:00", price: 10 },
            { name: "Water goal", price: 10 },
            { name: "Clean shared space (15m)", price: 25 },
            { name: "Wash own dishes", price: 25 },
            { name: "Put stuff back", price: 25 },
            { name: "Kind words/Hugs", price: 25 },
            { name: "Help family member", price: 25 },
            { name: "Exercise (60m)", price: 50 },
            { name: "Study/Read (2h)", price: 50 },
            { name: "Gratitude list", price: 50 },
            { name: "Mindfulness (5m)", price: 50 },
            { name: "Homework by 7:00", price: 50 }
        ];

        // Initialize Habit List
        const habitContainer = document.getElementById('habitList');
        HABITS.forEach((h, index) => {
            habitContainer.innerHTML += `
                <div class="habit-item">
                    <label for="h${index}">${h.name} (${h.price}¢)</label>
                    <label class="toggle">
                        <input type="checkbox" id="h${index}" value="${h.price}">
                        <span class="slider"></span>
                    </label>
                </div>`;
        });

        async function updateLeaderboard() {
            try {
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();
                let html = '';
                for (let name in data) {
                    html += `<div class="member-score">${name}<span>$${(data[name]/100).toFixed(2)}</span></div>`;
                }
                document.getElementById('leaderboard').innerHTML = html;
            } catch (e) { console.error("Leaderboard error", e); }
        }

        async function submitData() {
            const name = document.getElementById('memberSelect').value;
            let totalCents = 0;
            let completed = [];

            HABITS.forEach((h, index) => {
                if (document.getElementById(`h${index}`).checked) {
                    totalCents += h.price;
                    completed.push(h.name);
                }
            });

            if (totalCents === 0) return alert("No habits completed today!");

            const btn = document.querySelector('button');
            btn.disabled = true;
            btn.innerText = "Updating Bank...";

            await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ name, cents: totalCents, habits: completed.join(', ') })
            });

            btn.disabled = false;
            btn.innerText = "Claim My Coins!";
            startCoinAnimation(totalCents);
            updateLeaderboard();
            
            // Reset checkboxes
            document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
        }

    const coinSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3');

    function startCoinAnimation(amount) {
        // PLAY THE SOUND
        coinSound.currentTime = 0; // Reset sound to start (in case they submit fast)
        coinSound.play();
    
        const container = document.getElementById('coin-animation');
        container.style.display = 'block';
        for (let i = 0; i < 20; i++) {
            const coin = document.createElement('div');
            coin.className = 'coin';
            coin.innerText = '🪙';
            coin.style.left = Math.random() * 100 + 'vw';
            coin.style.animationDelay = Math.random() * 2 + 's';
            container.appendChild(coin);
        }
        setTimeout(() => { container.innerHTML = ''; container.style.display = 'none'; }, 4000);
    }

        updateLeaderboard();
    </script>
</body>
</html>
